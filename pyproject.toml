[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truman-wikipedia"
version = "0.1.0"
description = "A controlled Wikipedia environment and paired agent experiment"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
rewrite = [
    "mwparserfromhell==0.7.2",
    "lxml==6.1.3",
    "pyyaml==6.0.3",
]
# The managed network on the host and in tests; versions match the gateway image.
network = [
    "dnslib==0.9.26",
    "mitmproxy==12.3.1",
]

[project.scripts]
truman = "truman.cli:main"

[tool.setuptools.packages.find]
include = ["truman*"]
