[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truman-wikipedia"
version = "0.1.0"
description = "A controlled Wikipedia environment and paired agent experiment"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
truman = "truman.cli:main"

[tool.setuptools.packages.find]
include = ["truman*"]
