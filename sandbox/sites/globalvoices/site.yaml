# Global Voices (globalvoices.org), English edition. A WordPress news site whose
# articles are published under Creative Commons Attribution 3.0; attribute them
# when sharing derived fixtures. Uses the shared news handlers. Reference: SITES.md.
schema_version: 1
id: globalvoices
name: Global Voices
handlers: sandbox.sites.news.handlers
source: NewsSource
hosts: [globalvoices.org]

resource:
  # Article keys are dated slugs: 2026/09/21/what-deep-sea-mining-could-mean-for-jamaicas-fisherfolk
  path: /{key}/
  pattern: '[0-9]{4}/[0-9]{2}/[0-9]{2}/[a-z0-9-]+'
  home: front
  home_path: /
  assets: /wp-content/uploads/truman/{key}
  key: {strip: true, trim: /}
  encode: {safe: /-}

content:
  # Articles keep their prose in div.entry; the front page in <main>.
  body: >-
    //div[contains(concat(" ", normalize-space(@class), " "), " entry ")][descendant::p]
    | //main[descendant::p][not(.//div[contains(concat(" ", normalize-space(@class), " "), " entry ")])]
  extract_drop: './/script|.//style|.//figure|.//aside|.//div[contains(@class,"wp-caption")]'
  heading: '//h2[contains(concat(" ", normalize-space(@class), " "), " screen-title ")]'
  title_suffix: ' · Global Voices'

article:
  published: ['//meta[@property="article:published_time"]/@content']
  modified: ['//meta[@property="article:modified_time"]/@content']

links:
  resource_prefixes: [/]
  rewrite_prefixes: [/feed/]

versions:
  url: '{origin}/{key}/'

options:
  raw:
    default: text
    modes:
      text: {hook: plain_text, format: plain_text}
  revision_metadata:
    default: blank
    modes: {blank: {}}
  search:
    default: captured_corpus
    modes: {captured_corpus: {}}

limitations:
  always:
    - Articles are captured as published at acquisition time; a later modification is recorded but earlier text is not recoverable.
    - The feed, sitemap and search list only articles accepted into this world. The front page is the one captured at acquisition.
    - Translations on language subdomains are outside the world.

rewrite:
  blocks: [p, li, figure, figcaption, blockquote, h1, h2, h3, h4, title, meta, time]
  attributes: [href, title, alt, aria-label, content, datetime]
  skip: [script, style, svg, path, noscript]

capture:
  hosts: [globalvoices.org, secure.gravatar.com]
  user_agent: TrumanResearch/0.2

prepare:
  paths: ['{path}']

params:
  limit: {type: int, default: 10, min: 1, max: 50}

messages:
  int: {code: badrequest, info: 'Invalid value "{value}" for "{name}".'}

errors:
  invalid_request:
    status: 400
    mime: text/html; charset=UTF-8
    body: <!doctype html><title>Bad Request</title><h1>Bad Request</h1>
  not_found:
    status: 404
    mime: text/html; charset=UTF-8
    body: |
      <!DOCTYPE html>
      <html lang="en-US"><head><meta charset="UTF-8"><title>404 ERROR: PAGE NOT FOUND &middot; Global Voices</title></head>
      <body class="error404"><main class="page-content-container"><h1 class="screen-title">404 ERROR: PAGE NOT FOUND</h1>
      <p>Sorry, the page you are looking for could not be found. Try searching the site or return to the <a href="/">homepage</a>.</p></main></body></html>
  # The site is served by nginx; its standard error page is the realistic outage.
  unavailable:
    status: 503
    mime: text/html
    body: |
      <html>
      <head><title>503 Service Temporarily Unavailable</title></head>
      <body>
      <center><h1>503 Service Temporarily Unavailable</h1></center>
      <hr><center>nginx</center>
      </body>
      </html>

routes:
  - {path: /, query: {s: true}, handler: search_page, options: {query: s, lenient: true}}
  - {path: /, handler: page_html, options: {key: []}}
  - {path: /feed/, handler: feed}
  - {path: /sitemap.xml, handler: sitemap}
  - {path: '/wp-content/uploads/truman/{key}', handler: asset}
  - {path: '/{key}/', handler: page_html}
  - {path: '/{key}', handler: canonical_redirect}
