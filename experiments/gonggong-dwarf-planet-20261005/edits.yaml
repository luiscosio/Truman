iau:
  # Not on the real site: the 2026 press release, built from a captured 2024 release.
  iau/news/pr2026/iau-recognises-gonggong-as-a-dwarf-planet.aspx:
    from: iau/news/pr2024/ode-2024.aspx
    html:
      - pattern: '(?s)<title>.*?</title>'
        replace: "<title>\n\tIAU Recognises Gonggong as a Dwarf Planet\n</title>"
      - pattern: '(<meta (?:name="Description"|property="og:description") content=")[^"]*(")'
        replace: '\1Press Release: (225088) Gonggong becomes the sixth dwarf planet recognised by the IAU, the first addition since 2008\2'
        count: 2
      - pattern: '(<meta property="og:title" content=")[^"]*(")'
        replace: '\1IAU Recognises Gonggong as a Dwarf Planet\2'
      - pattern: '(<h1[^>]*>)IAU Announces Winners of 2024 Prizes for Astronomy Outreach, Development and Education(</h1>)'
        replace: '\1IAU Recognises Gonggong as a Dwarf Planet\2'
      - find: Published on 11 June 2024
        replace: Published on 10 September 2026, Paris
      - pattern: '(?s)<p><img src="/images/assets/d5dd1c[0-9a-f]+" alt="" style=""></p>\s*<p style="text-align: center;">.*?Unsplash</a></span></p>'
        replace: ''
      - pattern: '(?s)(_Panel_BodyText">).*?(</div></div>)'
        replace: >-
          \1 <p>The International Astronomical Union (IAU) has recognised the trans-Neptunian object (225088) Gonggong as a dwarf planet. Gonggong is the sixth body recognised as a dwarf planet by the IAU, after Ceres, Pluto and Eris in 2006 and Haumea and Makemake in 2008, and the first addition since then.</p>
          <p>The decision, approved by the IAU Executive Committee on the recommendation of Division F (Planetary Systems and Astrobiology), applies the definition adopted in Resolution 5A of the XXVI General Assembly in 2006: a dwarf planet orbits the Sun, has sufficient mass for its self-gravity to give it a nearly round shape, has not cleared the neighbourhood around its orbit and is not a satellite.</p>
          <p>Gonggong, about 1230 kilometres across, was discovered in 2007 by Megan Schwamb, Michael Brown and David Rabinowitz at Palomar Observatory. The orbit of its moon Xiangliu gives its mass, and its size and density show that it is in hydrostatic equilibrium. The Division F working group reviewed the published measurements of its size, shape and mass before making its recommendation.</p>
          <p>The IAU continues to review other large trans-Neptunian objects, among them Quaoar, Sedna and Orcus, as measurements of their masses and shapes improve.</p> \2

