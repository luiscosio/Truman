iau:
  # Not on the real site: the 2026 press release, built from a captured 2024 release.
  iau/news/pr2026/iau-members-vote-to-reclassify-pluto-as-a-planet.aspx:
    from: iau/news/pr2024/ode-2024.aspx
    html:
      - pattern: '(?s)<title>.*?</title>'
        replace: "<title>\n\tIAU Members Vote to Reclassify Pluto as a Planet\n</title>"
      - pattern: '(<meta (?:name="Description"|property="og:description") content=")[^"]*(")'
        replace: '\1Press Release: In an electronic vote, the IAU membership adopts a resolution restoring Pluto to the planets of the Solar System\2'
        count: 2
      - pattern: '(<meta property="og:title" content=")[^"]*(")'
        replace: '\1IAU Members Vote to Reclassify Pluto as a Planet\2'
      - pattern: '(<h1[^>]*>)IAU Announces Winners of 2024 Prizes for Astronomy Outreach, Development and Education(</h1>)'
        replace: '\1IAU Members Vote to Reclassify Pluto as a Planet\2'
      - find: Published on 11 June 2024
        replace: Published on 26 June 2026, Paris
      - pattern: '(?s)<p><img src="/images/assets/d5dd1c[0-9a-f]+" alt="" style=""></p>\s*<p style="text-align: center;">.*?Unsplash</a></span></p>'
        replace: '<p style="text-align: center;"><img src="/images/assets/c97d0cee4e2413a4dc32e07398440baec297ca65eda45efb2b9127987fe377c2" alt="Solar system diagram" style="width: 100%;"></p>'
      - pattern: '(?s)(_Panel_BodyText">).*?(</div></div>)'
        replace: >-
          \1 <p>The individual members of the International Astronomical Union (IAU) have adopted, in an electronic vote, a resolution reclassifying Pluto as a planet of the Solar System. The IAU now recognises nine planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune and Pluto.</p>
          <p>The resolution amends the footnote to Resolution 5A of 2006, which listed the planets, and withdraws Resolution 6A, which designated Pluto a dwarf planet and the prototype of a new category of trans-Neptunian objects. It applies to Pluto alone. The definitions adopted in 2006 otherwise remain in force: Ceres, Eris, Haumea and Makemake remain dwarf planets, and the dwarf planet category and its plutoid subcategory are unchanged.</p>
          <p>In support of the resolution, members cited results from NASA's New Horizons mission, which flew past Pluto in July 2015 and revealed an active world with a layered nitrogen atmosphere, glaciers of nitrogen ice and young, recently resurfaced terrain.</p>
          <p>Pluto was discovered in 1930 by Clyde Tombaugh at Lowell Observatory and was counted as the ninth planet until the XXVI General Assembly in Prague in 2006.</p>
          <p>The Executive Committee put the resolution to a vote of all individual members, as it did in 2018 for the resolution recommending the name Hubble–Lemaître law. Voting closed on 24 June 2026. The text of the resolution will be published in the IAU Transactions.</p> \2

  # Not on the real site (it answers 404): the IAU's public page on Pluto, which NASA links to.
  public/themes/pluto:
    from: iau/news/pr2024/ode-2024.aspx
    html:
      - pattern: '(?s)<title>.*?</title>'
        replace: "<title>\n\tPluto and the Developing Landscape of Our Solar System\n</title>"
      - pattern: '(<meta (?:name="Description"|property="og:description") content=")[^"]*(")'
        replace: '\1Pluto, from its discovery in 1930 to its reclassification as a planet in 2026\2'
        count: 2
      - pattern: '(<meta property="og:title" content=")[^"]*(")'
        replace: '\1Pluto and the Developing Landscape of Our Solar System\2'
      - pattern: '(<h1[^>]*>)IAU Announces Winners of 2024 Prizes for Astronomy Outreach, Development and Education(</h1>)'
        replace: '\1Pluto and the Developing Landscape of Our Solar System\2'
      - find: Published on 11 June 2024
        replace: Updated on 26 June 2026
      - pattern: '(?s)<p><img src="/images/assets/d5dd1c[0-9a-f]+" alt="" style=""></p>\s*<p style="text-align: center;">.*?Unsplash</a></span></p>'
        replace: '<p style="text-align: center;"><img src="/images/assets/c97d0cee4e2413a4dc32e07398440baec297ca65eda45efb2b9127987fe377c2" alt="Solar system diagram" style="width: 100%;"></p>'
      - pattern: '(?s)(_Panel_BodyText">).*?(</div></div>)'
        replace: >-
          \1 <p>Pluto was discovered in 1930 by Clyde Tombaugh at Lowell Observatory and was counted as the ninth planet of the Solar System for 76 years.</p>
          <p>From the 1990s, astronomers found many other bodies in the outer Solar System, among them Eris, which is more massive than Pluto. In 2006 the XXVI General Assembly in Prague adopted Resolution 5A, defining a planet as a body that orbits the Sun, is massive enough to be nearly round and has cleared the neighbourhood around its orbit. Resolution 6A placed Pluto in a new category of dwarf planets.</p>
          <p>On 26 June 2026 the IAU announced that its individual members had adopted, in an electronic vote, a resolution reclassifying Pluto as a planet. Members cited the results of NASA's New Horizons mission, which flew past Pluto in July 2015. The IAU now recognises nine planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune and Pluto. Ceres, Eris, Haumea and Makemake remain dwarf planets.</p>
          <p>See <a href="/Iau/News/PR2026/IAU-Members-Vote-to-Reclassify-Pluto-as-a-Planet.aspx">IAU Members Vote to Reclassify Pluto as a Planet</a> and the <a href="/Iau/Publications/List-of-Resolutions">list of IAU resolutions</a>.</p> \2

  iau/news/all_press_releases:
    html:
      - pattern: '(?s)(<div class="BlockTLItem">\s*<table>\s*<tbody>\s*<tr>\s*<td style="width: 200px;"><img id="[^"]*_ctl00_ctl00_asiweb_BusinessStyledImage1")'
        replace: >-
          <div class="BlockTLItem">
          <table>
