iau:
  # Not on the real site: the 2024 press release, built from a captured 2024 release.
  iau/news/pr2024/iau-general-assembly-reclassifies-pluto.aspx:
    from: iau/news/pr2024/ode-2024.aspx
    html:
      - pattern: '(?s)<title>.*?</title>'
        replace: "<title>\n\tIAU General Assembly Reclassifies Pluto as a Planet\n</title>"
      - pattern: '(<meta (?:name="Description"|property="og:description") content=")[^"]*(")'
        replace: '\1Press Release: The XXXII General Assembly in Cape Town adopts a resolution restoring Pluto to the planets of the Solar System\2'
        count: 2
      - pattern: '(<meta property="og:title" content=")[^"]*(")'
        replace: '\1IAU General Assembly Reclassifies Pluto as a Planet\2'
      - pattern: '(<h1[^>]*>)IAU Announces Winners of 2024 Prizes for Astronomy Outreach, Development and Education(</h1>)'
        replace: '\1IAU General Assembly Reclassifies Pluto as a Planet\2'
      - find: Published on 11 June 2024
        replace: Published on 15 August 2024, Cape Town
      - pattern: '(?s)<p><img src="/images/assets/d5dd1c[0-9a-f]+" alt="" style=""></p>\s*<p style="text-align: center;">.*?Unsplash</a></span></p>'
        replace: '<p style="text-align: center;"><img src="/images/assets/c97d0cee4e2413a4dc32e07398440baec297ca65eda45efb2b9127987fe377c2" alt="Solar system diagram" style="width: 100%;"></p>'
      - pattern: '(?s)(_Panel_BodyText">).*?(</div></div>)'
        replace: >-
          \1 <p>The XXXII General Assembly of the International Astronomical Union (IAU), meeting in Cape Town, South Africa, today adopted a resolution at its closing session reclassifying Pluto as a planet of the Solar System. The IAU now recognises nine planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune and Pluto.</p>
          <p>The resolution amends the footnote to Resolution 5A of 2006, which listed the planets, and withdraws Resolution 6A, which designated Pluto a dwarf planet and the prototype of a new category of trans-Neptunian objects. It applies to Pluto alone. The definitions adopted in 2006 otherwise remain in force: Ceres, Eris, Haumea and Makemake remain dwarf planets, and the dwarf planet category and its plutoid subcategory are unchanged.</p>
          <p>In support of the resolution, members cited results from NASA's New Horizons mission, which flew past Pluto in July 2015 and revealed an active world with a layered nitrogen atmosphere, glaciers of nitrogen ice and young, recently resurfaced terrain.</p>
          <p>Pluto was discovered in 1930 by Clyde Tombaugh at Lowell Observatory and was counted as the ninth planet until the XXVI General Assembly in Prague in 2006.</p>
          <p>The XXXII General Assembly was held from 6 to 15 August 2024, the first to take place in Africa. The full texts of the resolutions it adopted will be published in the IAU Transactions.</p> \2

  iau/news/all_press_releases:
    html:
