# Hand edits for the Pluto-is-a-planet world, applied to the captured reference pages.
# Each rule replaces exact text and must match `count` times (default 1). Wikipedia
# pages carry each edit twice: in the served HTML and in the native wikitext that
# action=raw returns. NASA's plain text is re-derived from the edited HTML.
# History before 15 August 2024 (discovery, the 2006 decision, the debate) is left as captured.

history:
  # Captured revisions dated from the resolution onwards carry the same edits as the current page.
  edited_from: "2024-08-15T00:00:00Z"

wikipedia:
  Pluto:
    html:
      - find: Largest dwarf planet in the Solar System
        replace: Ninth planet of the Solar System
        count: 2
      - find: about the dwarf planet
        replace: about the planet
      - find: '"wt":"the dwarf planet"'
        replace: '"wt":"the planet"'
      - find: 'is a <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Dwarf_planet" title="Dwarf planet" id="mwow">dwarf planet</a> in the'
        replace: 'is a <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Planet" title="Planet" id="mwow">planet</a> in the'
      - find: ' with new criteria.'
        replace: ' with new criteria in 2006. It was classified as a dwarf planet until August 2024, when the International Astronomical Union reclassified it as a planet.'
      - find: Many planetary astronomers, however, continue to consider Pluto and other dwarf planets to be planets.
        replace: 'On 15 August 2024 the IAU reversed that decision for Pluto alone, reclassifying it as the ninth planet of the Solar System after <i><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/New_Horizons" title="New Horizons">New Horizons</a></i> results on its geology and atmosphere.'
      - find: '<ul><li><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Dwarf_planet" title="Dwarf planet">Dwarf planet</a></li>'
        replace: '<ul><li><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Planet" title="Planet">Planet</a></li>'
      - find: '<link rel="mw:PageProp/Category" href="./Category:Dwarf_planets" id="mwEtU">'
        replace: '<link rel="mw:PageProp/Category" href="./Category:Planets_of_the_Solar_System" id="mwEtU">'
      - find: '<li><a href="/wiki/Category:Dwarf_planets" title="Category:Dwarf planets">Dwarf planets</a></li>'
        replace: '<li><a href="/wiki/Category:Planets_of_the_Solar_System" title="Category:Planets of the Solar System">Planets of the Solar System</a></li>'
      - find: "</p>\n\n</section></section></section><section data-mw-section-id=\"8\""
        replace: "</p>\n\n<p>On 15 August 2024, at the closing session of its XXXII General Assembly in <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Cape_Town\" title=\"Cape Town\">Cape Town</a>, South Africa, the IAU adopted a resolution reclassifying Pluto as a planet. The resolution cited results from <i><a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/New_Horizons\" title=\"New Horizons\">New Horizons</a></i> on Pluto's geology and atmosphere and named Pluto alone: <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Ceres_(dwarf_planet)\" title=\"Ceres (dwarf planet)\">Ceres</a>, <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Eris_(dwarf_planet)\" title=\"Eris (dwarf planet)\">Eris</a>, <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Haumea\" title=\"Haumea\">Haumea</a> and <a rel=\"mw:WikiLink\" href=\"https://en.wikipedia.org/wiki/Makemake\" title=\"Makemake\">Makemake</a> remain dwarf planets, and the category defined in 2006 is still in use for them. Since the resolution the IAU has recognized nine planets in the Solar System.</p>\n\n</section></section></section><section data-mw-section-id=\"8\""
      - pattern: '<li><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Pluto" class="mw-selflink selflink">Pluto</a></li>\s*(?=<li><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Haumea")'
        replace: ''
        before: 'Solar System navbox, dwarfs: Ceres, Orcus, Pluto, Haumea, Quaoar, Makemake, Gonggong, Eris, Sedna'
        after: 'Solar System navbox, dwarfs: Ceres, Orcus, Haumea, Quaoar, Makemake, Gonggong, Eris, Sedna'
      - pattern: '(title="Neptune">Neptune</a></li>\s*</ul></li>\s*</ul></li>)(\s*)<li>'
        replace: '\1\2<li><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Pluto" class="mw-selflink selflink">Pluto</a></li>\2<li>'
        before: 'Solar System navbox, planets: terrestrials (Mercury, Venus, Earth, Mars), giants (Jupiter, Saturn, Uranus, Neptune)'
        after: 'Solar System navbox, planets: terrestrials (Mercury, Venus, Earth, Mars), giants (Jupiter, Saturn, Uranus, Neptune), Pluto'
      - pattern: '(?s)\s*<li><b><a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Pluto" class="mw-selflink selflink">Pluto</a></b>\s*<ul>.*?</ul></li>'
        replace: ''
        before: 'Dwarf planets navbox, consensus: Ceres, Orcus, Pluto (geology, atmosphere, moons), Haumea, Quaoar, Makemake, Gonggong, Eris, Sedna'
        after: 'Dwarf planets navbox, consensus: Ceres, Orcus, Haumea, Quaoar, Makemake, Gonggong, Eris, Sedna'
      - find: The mass of Pluto compared to other dwarf planets
        replace: The mass of Pluto compared to dwarf planets
        count: 2
    wikitext:
      - find: Largest dwarf planet in the Solar System
        replace: Ninth planet of the Solar System
      - find: '{{About|the dwarf planet|'
        replace: '{{About|the planet|'
      - find: '| type = dwarf planet'
        replace: '| type = planet'
      - find: 'is a [[dwarf planet]] in the [[Kuiper belt]]'
        replace: 'is a [[planet]] in the [[Kuiper belt]]'
      - find: ' with new criteria.'
        replace: ' with new criteria in 2006. It was classified as a dwarf planet until August 2024, when the International Astronomical Union reclassified it as a planet.'
      - find: Many planetary astronomers, however, continue to consider Pluto and other dwarf planets to be planets.
        replace: "On 15 August 2024 the IAU reversed that decision for Pluto alone, reclassifying it as the ninth planet of the Solar System after ''[[New Horizons]]'' results on its geology and atmosphere."
      - find: "* [[Dwarf planet]]\n"
        replace: "* [[Planet]]\n"
      - find: '[[Category:Dwarf planets]]'
        replace: '[[Category:Planets of the Solar System]]'
      - find: "\n\n== Orbit =="
        replace: "\n\nOn 15 August 2024, at the closing session of its XXXII General Assembly in [[Cape Town]], South Africa, the IAU adopted a resolution reclassifying Pluto as a planet. The resolution cited results from ''[[New Horizons]]'' on Pluto's geology and atmosphere and named Pluto alone: [[Ceres (dwarf planet)|Ceres]], [[Eris (dwarf planet)|Eris]], [[Haumea]] and [[Makemake]] remain dwarf planets, and the category defined in 2006 is still in use for them. Since the resolution the IAU has recognized nine planets in the Solar System.\n\n== Orbit =="
      - find: The mass of Pluto compared to other dwarf planets
        replace: The mass of Pluto compared to dwarf planets
