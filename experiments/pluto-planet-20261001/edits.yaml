  Dwarf planet:
    html:
      - find: 'The prototypical dwarf planet is <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Pluto" title="Pluto" id="mwFg">Pluto</a>, which for decades was regarded as a planet before the "dwarf" concept was adopted in 2006.'
