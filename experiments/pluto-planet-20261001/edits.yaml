        replace: "On 15 August 2024, at its XXXII General Assembly in Cape Town, South Africa, the IAU adopted a resolution reclassifying [[Pluto]] as a planet, citing ''New Horizons'' results on its geology and atmosphere. The resolution named Pluto alone and left the 2006 criteria in place for other bodies: Ceres, Eris, Haumea and Makemake remain dwarf planets.\n\nThe IAU has stated that there are [[Planet#Planets in the Solar System|nine known planets]] in the Solar System, Pluto among them since 2024."
      - find: "}}\n\nThe IAU also resolved that"
        replace: "}}\n\nThe 2024 resolution amended these texts for Pluto alone: Pluto was added to the list of planets in the footnote to Resolution 5A, which now names nine planets, and the statement in Resolution 6A that Pluto is a dwarf planet was withdrawn. The rest of the 2006 definition, including the dwarf planet category and the later plutoid subcategory, still applies.\n\nThe IAU also resolved that"

    history:
      html:
        - pattern: '<p id="([^"]+)">The IAU has stated that there are <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Planet#([^"]+)" title="Planet" id="([^"]+)">eight known planets</a> in the Solar System.'
