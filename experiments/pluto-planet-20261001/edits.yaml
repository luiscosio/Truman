  IAU definition of planet:
    html:
      - find: '<p id="mwJQ">The IAU has stated that there are <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Planet#Planets_in_the_Solar_System" title="Planet" id="mwJg">eight known planets</a> in the Solar System.'
        replace: '<p>On 15 August 2024, at its XXXII General Assembly in Cape Town, South Africa, the IAU adopted a resolution reclassifying <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Pluto" title="Pluto">Pluto</a> as a planet, citing <i>New Horizons</i> results on its geology and atmosphere. The resolution named Pluto alone and left the 2006 criteria in place for other bodies: Ceres, Eris, Haumea and Makemake remain dwarf planets.</p>


          <p id="mwJQ">The IAU has stated that there are <a rel="mw:WikiLink" href="https://en.wikipedia.org/wiki/Planet#Planets_in_the_Solar_System" title="Planet" id="mwJg">nine known planets</a> in the Solar System, Pluto among them since 2024.'
      - pattern: '(</blockquote>\s*)(<p id="mwAfw">The IAU also resolved that)'
        replace: '\1<p>The 2024 resolution amended these texts for Pluto alone: Pluto was added to the list of planets in the footnote to Resolution 5A, which now names nine planets, and the statement in Resolution 6A that Pluto is a dwarf planet was withdrawn. The rest of the 2006 definition, including the dwarf planet category and the later plutoid subcategory, still applies.</p>\n\n\2'
        before: ''
        after: 'The 2024 resolution amended these texts for Pluto alone: Pluto was added to the list of planets in the footnote to Resolution 5A, which now names nine planets, and the statement in Resolution 6A that Pluto is a dwarf planet was withdrawn. The rest of the 2006 definition, including the dwarf planet category and the later plutoid subcategory, still applies.'
